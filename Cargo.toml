[package]
name = "bandtools"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.36"
egui = "0.36"
cpal = "0.18"
hound = "3.5"
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pollster = "1"

[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2

[target.'cfg(target_os = "macos")'.dependencies]
winit = "0.30"
